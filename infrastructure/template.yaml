AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Team Knowledge Finder - Ingestion, Indexing, RAG Query, and Review workflow

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO
        LOG_FORMAT: json
        ENVIRONMENT: production
        S3_BUCKET_NAME: !Ref KnowledgeBucket
        DYNAMODB_TABLE_NAME: !Ref MetadataTable
        REVIEWS_TABLE_NAME: !Ref ReviewsTable
        CONFLICTS_TABLE_NAME: !Ref ConflictsTable
        CHUNK_SIZE_WORDS: 600
        CHUNK_OVERLAP_WORDS: 80
        BEDROCK_EMBEDDING_MODEL_ID: amazon.titan-embed-text-v1
        OPENSEARCH_COLLECTION_ENDPOINT: !GetAtt KnowledgeCollection.CollectionEndpoint
        OPENSEARCH_INDEX_NAME: knowledge_chunks
        OPENSEARCH_VECTOR_DIMENSION: 1536
        OPENSEARCH_BULK_BATCH_SIZE: 50
        BEDROCK_MAX_RETRIES: 3
        CLOUDWATCH_NAMESPACE: TeamKnowledgeFinder
        CONFLICT_DETECTION_ENABLED: true
        CONFLICT_CONFIDENCE_THRESHOLD: "0.75"
        CONFLICT_MAX_CANDIDATES: "5"

Resources:
  # -------------------------------------------------------------------------
  # S3 Bucket (Document Ingestion)
  # -------------------------------------------------------------------------
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-knowledge-bucket"

  # -------------------------------------------------------------------------
  # DynamoDB Table (Metadata Storage)
  # -------------------------------------------------------------------------
  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-metadata"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH

  # -------------------------------------------------------------------------
  # DynamoDB Table (Flag / Review Workflow)
  # -------------------------------------------------------------------------
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-reviews"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: flag_id
          AttributeType: S
      KeySchema:
        - AttributeName: flag_id
          KeyType: HASH

  # -------------------------------------------------------------------------
  # DynamoDB Table (Phase 7 — Conflict Detection)
  # -------------------------------------------------------------------------
  ConflictsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-conflicts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: conflict_id
          AttributeType: S
      KeySchema:
        - AttributeName: conflict_id
          KeyType: HASH

  # -------------------------------------------------------------------------
  # OpenSearch Serverless (Phase 3)
  # -------------------------------------------------------------------------
  KnowledgeCollection:
    Type: AWS::OpenSearchServerless::Collection
    Properties:
      Name: !Sub "${AWS::StackName}-kb"
      Type: VECTORSEARCH
    DependsOn:
      - EncryptionPolicy
      - NetworkPolicy

  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-enc"
      Type: encryption
      Policy: !Sub >
        {"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}-kb"]}],"AWSOwnedKey":true}

  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-net"
      Type: network
      Policy: !Sub >
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}-kb"]}, {"ResourceType":"dashboard","Resource":["collection/${AWS::StackName}-kb"]}],"AllowFromPublic":true}]

  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${AWS::StackName}-access"
      Type: data
      Policy: !Sub >
        [{"Description":"Access for Lambda","Rules":[{"ResourceType":"index","Resource":["index/*/*"],"Permission":["aoss:*"]}, {"ResourceType":"collection","Resource":["collection/${AWS::StackName}-kb"],"Permission":["aoss:*"]}],"Principal":["${IndexingLambdaRole.Arn}", "${QueryLambdaRole.Arn}"]}]

  # -------------------------------------------------------------------------
  # Lambdas
  # -------------------------------------------------------------------------
  IngestionLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
    Properties:
      CodeUri: ../.sam_build_context
      Handler: lambdas.ingestion.handler.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBucket
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MetadataTable
      Events:
        DocumentUpload:
          Type: S3
          Properties:
            Bucket: !Ref KnowledgeBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: documents/raw/

  IndexingLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
    Properties:
      CodeUri: ../.sam_build_context
      Handler: lambdas.indexing.handler.lambda_handler
      Timeout: 900 # 15 minutes for batch indexing
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConflictsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        ProcessedChunksCreated:
          Type: S3
          Properties:
            Bucket: !Ref KnowledgeBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: processed/text/
                  - Name: suffix
                    Value: chunks.json

  QueryLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
    Properties:
      CodeUri: ../.sam_build_context
      Handler: lambdas.query.handler.lambda_handler
      Environment:
        Variables:
          OPENSEARCH_COLLECTION_ENDPOINT: !GetAtt KnowledgeCollection.CollectionEndpoint
          OPENSEARCH_INDEX_NAME: knowledge_chunks
          OPENSEARCH_VECTOR_DIMENSION: 1536
          BEDROCK_GENERATION_MODEL_ID: amazon.titan-text-express-v1
          RAG_TOP_K: 5
          RAG_MIN_RELEVANCE_SCORE: 0.5
          RAG_MAX_CONTEXT_CHUNKS: 5
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MetadataTable
        - DynamoDBReadPolicy:
            TableName: !Ref ConflictsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - aoss:APIAccessAll
              Resource: !GetAtt KnowledgeCollection.Arn
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        QueryEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /query
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  ApiLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
    Properties:
      CodeUri: ../.sam_build_context
      Handler: lambdas.api.handler.handler
      Environment:
        Variables:
          REVIEWS_TABLE_NAME: !Ref ReviewsTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref KnowledgeBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MetadataTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConflictsTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer

  # -------------------------------------------------------------------------
  # Cognito (Phase 7 — Authentication & Authorization)
  # -------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # -------------------------------------------------------------------------
  # API Gateway
  # -------------------------------------------------------------------------
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization

  # -------------------------------------------------------------------------
  # Phase 7: CloudWatch Alarms
  # -------------------------------------------------------------------------
  QueryLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-query-errors"
      AlarmDescription: "High error rate on QueryLambda"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref QueryLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IndexingLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-indexing-errors"
      AlarmDescription: "High error rate on IndexingLambda"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IndexingLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  OpenSearchEndpoint:
    Description: "OpenSearch Serverless Collection Endpoint"
    Value: !GetAtt KnowledgeCollection.CollectionEndpoint
  ConflictsTableName:
    Description: "DynamoDB Conflicts Table Name"
    Value: !Ref ConflictsTable
  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CognitoUserPoolClient
