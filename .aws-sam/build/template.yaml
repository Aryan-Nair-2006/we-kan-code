AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Team Knowledge Finder - Phase 3 Document Ingestion and Vector Indexing
Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO
        S3_BUCKET_NAME:
          Ref: KnowledgeBucket
        DYNAMODB_TABLE_NAME:
          Ref: MetadataTable
        CHUNK_SIZE_WORDS: 600
        CHUNK_OVERLAP_WORDS: 80
        BEDROCK_EMBEDDING_MODEL_ID: amazon.titan-embed-text-v1
        OPENSEARCH_COLLECTION_ENDPOINT:
          Fn::GetAtt:
          - KnowledgeCollection
          - CollectionEndpoint
        OPENSEARCH_INDEX_NAME: knowledge_chunks
        OPENSEARCH_VECTOR_DIMENSION: 1536
        OPENSEARCH_BULK_BATCH_SIZE: 50
        BEDROCK_MAX_RETRIES: 3
Resources:
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-knowledge-bucket
  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-metadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: document_id
        AttributeType: S
      KeySchema:
      - AttributeName: document_id
        KeyType: HASH
  KnowledgeCollection:
    Type: AWS::OpenSearchServerless::Collection
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-kb
      Type: VECTORSEARCH
    DependsOn:
    - EncryptionPolicy
    - NetworkPolicy
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-enc
      Type: encryption
      Policy:
        Fn::Sub: '{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}-kb"]}],"AWSOwnedKey":true}

          '
  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-net
      Type: network
      Policy:
        Fn::Sub: '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${AWS::StackName}-kb"]},
          {"ResourceType":"dashboard","Resource":["collection/${AWS::StackName}-kb"]}],"AllowFromPublic":true}]

          '
  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-access
      Type: data
      Policy:
        Fn::Sub: '[{"Description":"Access for Lambda","Rules":[{"ResourceType":"index","Resource":["index/*/*"],"Permission":["aoss:*"]},
          {"ResourceType":"collection","Resource":["collection/${AWS::StackName}-kb"],"Permission":["aoss:*"]}],"Principal":["${IndexingLambdaRole.Arn}",
          "${QueryLambdaRole.Arn}"]}]

          '
  IngestionLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
      SamResourceId: IngestionLambda
    Properties:
      CodeUri: IngestionLambda
      Handler: lambdas.ingestion.handler.lambda_handler
      Policies:
      - S3ReadPolicy:
          BucketName:
            Ref: KnowledgeBucket
      - S3CrudPolicy:
          BucketName:
            Ref: KnowledgeBucket
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MetadataTable
      Events:
        DocumentUpload:
          Type: S3
          Properties:
            Bucket:
              Ref: KnowledgeBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                - Name: prefix
                  Value: documents/raw/
  IndexingLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
      SamResourceId: IndexingLambda
    Properties:
      CodeUri: IndexingLambda
      Handler: lambdas.indexing.handler.lambda_handler
      Timeout: 900
      Policies:
      - S3ReadPolicy:
          BucketName:
            Ref: KnowledgeBucket
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MetadataTable
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
        - Effect: Allow
          Action:
          - aoss:APIAccessAll
          Resource: '*'
      Events:
        ProcessedChunksCreated:
          Type: S3
          Properties:
            Bucket:
              Ref: KnowledgeBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                - Name: prefix
                  Value: processed/text/
                - Name: suffix
                  Value: chunks.json
  QueryLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildProperties:
        Manifest: lambdas/requirements.txt
      SamResourceId: QueryLambda
    Properties:
      CodeUri: QueryLambda
      Handler: lambdas.query.handler.lambda_handler
      Environment:
        Variables:
          OPENSEARCH_COLLECTION_ENDPOINT:
            Fn::GetAtt:
            - KnowledgeCollection
            - CollectionEndpoint
          OPENSEARCH_INDEX_NAME: knowledge_chunks
          OPENSEARCH_VECTOR_DIMENSION: 1536
          BEDROCK_GENERATION_MODEL_ID: amazon.titan-text-express-v1
          RAG_TOP_K: 5
          RAG_MIN_RELEVANCE_SCORE: 0.5
          RAG_MAX_CONTEXT_CHUNKS: 5
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: MetadataTable
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource: '*'
        - Effect: Allow
          Action:
          - aoss:APIAccessAll
          Resource:
            Fn::GetAtt:
            - KnowledgeCollection
            - Arn
      Events:
        QueryEndpoint:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGatewayApi
            Path: /query
            Method: POST
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  OpenSearchEndpoint:
    Description: OpenSearch Serverless Collection Endpoint
    Value:
      Fn::GetAtt:
      - KnowledgeCollection
      - CollectionEndpoint
